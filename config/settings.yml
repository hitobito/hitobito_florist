# Settings relevant for the hitobito_florist wagon
# Overrides settings from the main application
application:
  name: florist.ch  # set same name in email.sender and email.mass_recipient
  languages:
    de: Deutsch
    fr: Français
    it: Italiano

  # non UI languages for assigning to person#language
  # additional_languages:
  #   en: Englisch

  logo:
    image: logo.png
    width: 180
    height: 32
    background_color: none

# The person with this email has root access to everything
# This person should only be used by the operators of the application,
# not the customers.
# Initially, a password reset token may be mailed from the application
# to this address to set a password.
root_email: hitobito-florist@puzzle.ch

phone_number:
  custom_label:
    enabled: false

social_account:
  custom_label:
    enabled: false

additional_email:
  custom_label:
    enabled: false

additional_address:
  custom_label:
    enabled: false

groups:
  period_invoice_templates:
    enabled: true
    item_classes:
      "PeriodInvoiceTemplate::FeeCalculationItem":

florist:
  membership_fees:
