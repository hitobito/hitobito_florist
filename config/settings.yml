        item_type: "Invoice::EmployeeCountConditionalItem"
        account: "3001"
        cost_center: "310"
        dynamic_cost_parameters:
          unit_cost: 340
          relevant_role_types:
            - Group::Sektion::Aktivmitglied
          min_employees: 0
          max_employees: 1

